services:
  # ── Backend: FastAPI Web Service ──────────────────────────────────────────
  - type: web
    name: api-agent-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        sync: false 
      - key: GEMINI_API_KEY
        sync: false 
      - key: MISTRAL_API_KEY
        sync: false 
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://api-agent-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://api-agent-frontend.onrender.com"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_PROVIDER
        value: both 

      # ── Auth (Clerk) ──────────────────────────────────────────
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false

      # ── Billing ──────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PLAN_ID
        sync: false

  # ── Frontend: Next.js Web Service (NOT Static Site) ───────────────────────
  - type: web
    name: api-agent-frontend
    runtime: node
    # Use npm instead of pnpm for maximum compatibility on Render free tier
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api-agent-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false # Set this in Render Dashboard
      - key: CLERK_SECRET_KEY
        sync: false # Needed for middleware
      - key: NODE_VERSION
        value: 20.0.0
