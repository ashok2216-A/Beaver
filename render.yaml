services:
  # ── Backend: FastAPI Web Service ──────────────────────────────────────────
  - type: web
    name: api-agent-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL URL here in the Render Dashboard
      - key: ADMIN_KEY
        sync: false # Set your master access key here (e.g. a long password)
      - key: GEMINI_API_KEY
        sync: false # Set this in Render Dashboard
      - key: MISTRAL_API_KEY
        sync: false # Set this in Render Dashboard
      - key: ALLOWED_ORIGINS
        value: "https://api-agent-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://api-agent-frontend.onrender.com"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_PROVIDER
        value: both # razorpay | stripe | both

      # ── Auth (Clerk) ──────────────────────────────────────────
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false

      # ── Billing (Stripe) ──────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PLAN_ID
        sync: false

      # ── Billing (Razorpay) ────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false

  # ── Frontend: Static Site ─────────────────────────────────────────────────
  - type: static_site
    name: api-agent-frontend
    buildCommand: cd frontend && pnpm install && pnpm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api-agent-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://api-agent-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
