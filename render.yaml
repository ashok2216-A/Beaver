services:
  # ── Backend: FastAPI Web Service ──────────────────────────────────────────
  - type: web
    name: api-agent-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: api-agent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set this in Render Dashboard
      - key: MISTRAL_API_KEY
        sync: false # Set this in Render Dashboard
      - key: ALLOWED_ORIGINS
        value: "*" # Update this with your frontend URL later
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

  # ── Frontend: Static Site ─────────────────────────────────────────────────
  - type: web
    name: api-agent-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: api-agent-backend
          property: host
    rewriteRules:
      - source: /*
        destination: /index.html

# ── Database: PostgreSQL ────────────────────────────────────────────────────
databases:
  - name: api-agent-db
    plan: free # Change to 'starter' if you need persistence > 90 days
